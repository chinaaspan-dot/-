<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Для Мадины 🤍</title>


<style>


*{
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}


body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    overflow:auto;

    padding:20px;


    background:
    linear-gradient(
        135deg,
        #ffe5ec,
        #e8ddff,
        #dff8ef
    );


    background-size:300% 300%;

    animation:bg 12s infinite alternate;

}



@keyframes bg{

    from{
        background-position:0% 50%;
    }

    to{
        background-position:100% 50%;
    }

}



.screen{

    width:520px;

    max-width:100%;

    max-height:90vh;

    overflow-y:auto;

    padding:40px;


    background:
    rgba(255,255,255,.78);


    backdrop-filter:blur(15px);


    border-radius:35px;


    text-align:center;


    box-shadow:
    0 25px 60px rgba(0,0,0,.15);


    animation:
    show .7s ease;

}



@keyframes show{

    from{

        opacity:0;

        transform:
        translateY(30px)
        scale(.95);

    }


    to{

        opacity:1;

        transform:
        translateY(0)
        scale(1);

    }

}



.hidden{

    display:none;

}



h1{

    color:#9b6fa5;

    font-size:38px;

}



h2{

    color:#9b6fa5;

}



p{

    color:#555;

    font-size:18px;

    line-height:1.7;

}



button{


    border:none;

    cursor:pointer;


    padding:
    15px 35px;


    border-radius:50px;


    color:white;


    font-size:17px;


    font-weight:600;


    background:

    linear-gradient(
    135deg,
    #d8a7ff,
    #b57be8
    );


    transition:.3s;


    box-shadow:
    0 10px 25px
    rgba(181,123,232,.35);

}



button:hover{

    transform:
    translateY(-4px)
    scale(1.05);

}




input,
textarea{


    width:100%;


    padding:14px;


    margin:10px 0;


    border-radius:18px;


    border:1px solid #ddd;


    font-size:16px;

}


textarea{

    height:100px;

}



.plan{

    display:block;

    padding:20px;

    margin:15px 0;

    border-radius:25px;

    cursor:pointer;

    background:
    rgba(255,255,255,.7);


    border:
    2px solid transparent;


    transition:.35s;


}


.plan input{

    display:none;

}



.plan:hover{

    transform:
    translateY(-5px);


    box-shadow:
    0 15px 35px
    rgba(0,0,0,.12);

}



.plan:has(input:checked){


    border-color:#c89be8;


    background:
    linear-gradient(
    135deg,
    #fce7f3,
    #eee0ff
    );


    transform:
    scale(1.03);


}

.emoji{

    font-size:45px;

    margin-bottom:10px;

}


.plan h3{

    color:#8d6f8f;

    margin:5px;

}


.plan p{

    font-size:15px;

    margin:5px;

}



.plan:hover{

    transform:translateY(-3px);

}



.answer{

    height:140px;

    position:relative;

}



#noBtn{

    position:fixed;

    z-index:10;

}



.star{

    position:fixed;

    bottom:-20px;

    color:white;

    font-size:25px;

    animation:fly 7s linear forwards;

}



@keyframes fly{

    from{

        transform:translateY(0);

        opacity:0;

    }


    to{

        transform:translateY(-110vh);

        opacity:0;

    }

}



.heart{

    position:fixed;

    bottom:-20px;

    font-size:25px;

    animation:heart 3s linear forwards;

}



@keyframes heart{

    to{

        transform:
        translateY(-110vh)
        rotate(360deg);

        opacity:0;

    }

.fate{

    animation:
    fateShow .8s ease;

    box-shadow:
    0 0 40px
    rgba(216,167,255,.8);

}


@keyframes fateShow{

    from{

        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(.5);

    }


    to{

        opacity:1;

        transform:
        translate(-50%,-50%)
        scale(1);

    }





@keyframes floatEnvelope{


0%{

transform:
translateY(0);

}


50%{

transform:
translateY(-12px);

}


100%{

transform:
translateY(0);

}


.opening{

    animation:
    openLetter 1.5s ease forwards;

}



@keyframes openLetter{


    0%{

        transform:
        scale(1)
        rotate(0deg);

        opacity:1;

    }


    40%{

        transform:
        scale(1.15)
        rotate(-5deg);

    }


    70%{

        transform:
        scale(1.1)
        rotate(5deg);

    }


    100%{

        transform:
        scale(.2)
        translateY(-150px);

        opacity:0;

    }


}



@keyframes openLetter{


    0%{

        transform:
        scale(1);

        opacity:1;

    }


    50%{

        transform:
        scale(1.15)
        rotate(3deg);

    }


    100%{

        transform:
        scale(.7)
        translateY(-50px);

        opacity:0;

    }


.envelope{

    width:220px;

    height:140px;

    position:relative;

    margin:0 auto 30px;

    cursor:pointer;

    perspective:800px;

}



.back{

    position:absolute;

    width:100%;

    height:100%;

    background:#d8a7ff;

    border-radius:10px;

}



.paper{

    position:absolute;

    z-index:2;

    width:160px;

    height:110px;

    background:white;

    left:30px;

    top:20px;

    border-radius:8px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:45px;

    transition:1s;

}



.front{

    position:absolute;

    bottom:0;

    width:0;

    height:0;

    border-left:110px solid transparent;

    border-right:110px solid transparent;

    border-bottom:80px solid #c38be8;

    z-index:3;

}



.flap{

    position:absolute;

    top:0;

    left:0;

    width:0;

    height:0;

    border-left:90px solid transparent;

    border-right:90px solid transparent;

    border-top:65px solid #c28bea;

    transform-origin:top;

    transition:1s;

}



.paper{

    position:absolute;

    background:white;

    width:130px;

    height:90px;

    left:25px;

    top:25px;

    border-radius:5px;

    transition:1s;

}



.letter{

    position:absolute;

    z-index:3;

    left:75px;

    top:45px;

    font-size:30px;

    transition:1s;

}



/* открытие */

.envelope.open .flap{

    transform:
    rotateX(180deg);

}



.envelope.open .paper{

    transform:
    translateY(-70px);

}



.envelope.open .letter{

    transform:
    translateY(-80px);

}


</style>

</head>


<body>



<!-- ЭКРАН 1 -->

<div id="one" class="screen">


<div class="envelope" onclick="openInvite()">

    <div class="back"></div>

    <div class="paper">
        🤍
    </div>

    <div class="front"></div>

    <div class="flap"></div>

</div>



<h1>
Для Анары 🤍
</h1>


<p>
У меня есть маленькое, но особенное приглашение для тебя ✨
</p>



<button onclick="openInvite()">

Открыть письмо 💌

</button>


</div>






<!-- ЭКРАН 2 -->

<div id="two" class="screen hidden">


<h1>
Мадина 🤍
</h1>



<p>
Мне хочется провести этот вечер вместе с тобой.
</p>



<p>
Улыбки, приятные разговоры
и хорошая атмосфера ✨
</p>



<h2>
Ты согласна?
</h2>



<div class="answer">


<button onclick="openPlans()">

Да ❤️

</button>



<button id="noBtn">

Нет 🙈

</button>


</div>


</div>








<!-- ЭКРАН 3 -->


<div id="three" class="screen hidden">


<h1>
✨ Наш вечер
</h1>



<h2>
📅 Дата
</h2>


<input
id="date"
type="date">



<h2>
🕒 Время
</h2>


<input
id="time"
type="time">





<h2>
Куда пойдем? 🤍
</h2>



<div class="plans">


<label class="plan">


<input
type="radio"
name="plan"
value="🎬 Кино + ☕ Кофейня">


<div class="emoji">
🎬☕
</div>


<h3>
Кино и кофейня
</h3>


<p>
Фильм, вкусный кофе
и уютный разговор после
</p>


</label>






<label class="plan">


<input
type="radio"
name="plan"
value="🌳 Прогулка + ☕ Кофейня">


<div class="emoji">
🌳🤍
</div>


<h3>
Прогулка
</h3>


<p>
Красивые места, свежий воздух
и спокойный вечер
</p>


</label>







<label class="plan">


<input
type="radio"
name="plan"
value="☕ Уютная кофейня">


<div class="emoji">
☕✨
</div>


<h3>
Кофейня
</h3>


<p>
Тёплая атмосфера,
разговоры и улыбки
</p>


</label>


</div>







<textarea
placeholder="Твои пожелания ✨">
</textarea>





<button onclick="finishInvite()">

Подтвердить 🤍

</button>



</div>










<!-- ЭКРАН 4 -->


<div id="four" class="screen hidden">


<h1>
Мадина 🤍
</h1>


<p id="result"></p>



<h1>
✨
</h1>


<p>
Буду ждать нашей встречи ❤️
</p>



</div>

<script>


// =======================
// ПЕРЕХОДЫ
// =======================


function openInvite(){


let envelope =
document.querySelector(".envelope");


envelope.classList.add("open");



setTimeout(()=>{


document
.getElementById("one")
.classList.add("hidden");



document
.getElementById("two")
.classList.remove("hidden");



},1500);



}



function openPlans(){


createHearts();


document
.getElementById("two")
.classList.add("hidden");


document
.getElementById("three")
.classList.remove("hidden");


}






// =======================
// ФИНАЛ
// =======================


function finishInvite(){


let date =
document.getElementById("date").value;


let time =
document.getElementById("time").value;



let plan =
document.querySelector(
'input[name="plan"]:checked'
);




if(!date){

alert("Выбери дату 📅");

return;

}



if(!time){

alert("Выбери время 🕒");

return;

}



if(!plan){

alert("Выбери вариант встречи ✨");

return;

}





let niceDate =
new Date(date)
.toLocaleDateString(
"ru-RU",
{

day:"numeric",

month:"long",

year:"numeric"

}
);






document
.getElementById("three")
.classList.add("hidden");



document
.getElementById("four")
.classList.remove("hidden");





document
.getElementById("result")
.innerHTML =


`
Спасибо, что выбрала этот вечер ✨

<br><br>

📅 ${niceDate}

<br>

🕒 ${time}

<br><br>


✨ Наш план:

<br>

<b>${plan.value}</b>

<br><br>

Я буду ждать нашей встречи 🤍

`;



confetti();



}






// =======================
// КНОПКА НЕТ
// =======================


let noBtn =
document.getElementById("noBtn");



let attempts = 0;



function moveNo(){


attempts++;




if(attempts >= 5){


noBtn.onmouseover = null;

noBtn.ontouchstart = null;


noBtn.innerHTML =
"Кажется, судьба говорит выбрать ❤️";

noBtn.classList.add("fate");


noBtn.style.left =
"50%";


noBtn.style.top =
"50%";


noBtn.style.transform =
"translate(-50%, -50%)";


noBtn.style.position =
"fixed";


noBtn.style.width =
"auto";


noBtn.style.minWidth =
"280px";


noBtn.onclick=function(){

createHearts();

openPlans();

};


return;

}





let width =
noBtn.offsetWidth;



let height =
noBtn.offsetHeight;



let x =
Math.random()
*
(
window.innerWidth-width-20
);



let y =
Math.random()
*
(
window.innerHeight-height-20
);



noBtn.style.left =
x+"px";



noBtn.style.top =
y+"px";



}




noBtn.addEventListener(
"mouseover",
moveNo
);



noBtn.addEventListener(
"touchstart",
function(e){

e.preventDefault();

moveNo();

}

);







// =======================
// СЕРДЕЧКИ
// =======================


function createHearts(){


for(
let i=0;
i<30;
i++
){


let heart =
document.createElement("div");



heart.className="heart";



heart.innerHTML="❤️";



heart.style.left =
Math.random()*100+"vw";



heart.style.animationDuration =
(
2+
Math.random()*2
)
+"s";



document.body.appendChild(heart);



setTimeout(()=>{

heart.remove();

},3000);



}


}






// =======================
// ЗВЕЗДЫ
// =======================


function createStar(){


let star =
document.createElement("div");



star.className="star";



star.innerHTML="✦";



star.style.left =
Math.random()*100+"vw";



star.style.animationDuration =
(
4+
Math.random()*5
)
+"s";



document.body.appendChild(star);



setTimeout(()=>{

star.remove();

},8000);



}



setInterval(
createStar,
400
);






// =======================
// КОНФЕТТИ
// =======================


function confetti(){


for(
let i=0;
i<50;
i++
){


let item =
document.createElement("div");



item.innerHTML =
[
"❤️",
"✨",
"🤍",
"🌸"
]
[
Math.floor(
Math.random()*4
)
];



item.style.position="fixed";


item.style.left =
Math.random()*100+"vw";



item.style.top="-20px";



item.style.fontSize="25px";



item.style.transition="3s";



document.body.appendChild(item);



setTimeout(()=>{


item.style.transform =
"translateY(110vh) rotate(360deg)";


item.style.opacity=0;



},100);



setTimeout(()=>{


item.remove();



},3500);



}


}



</script>


</body>

</html>
